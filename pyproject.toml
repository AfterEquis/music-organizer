[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aftertune"
version = "1.0.0"
authors = [
  { name="AfterEquis", email="your-email@example.com" },
]
description = "Descarga y organiza tu música automáticamente por género usando IA de internet."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "yt-dlp",
    "mutagen",
    "requests",
]

[project.urls]
"Homepage" = "https://github.com/AfterEquis/music-organizer"
"Bug Tracker" = "https://github.com/AfterEquis/music-organizer/issues"

[project.scripts]
aftertune = "aftertune.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aftertune*"]
